<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2f8f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"><title>خالد أونلاين – المبيعات والفواتير</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#3a2f8f;--g2:#ecebf8;--bg:#f4f6f5;--card:#fff;--tx:#1b2621;--mu:#6b7a73;--bd:#dde5e1;--rd:#c0392b}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#8fa8f0;--g2:#22254a;--bg:#111815;--card:#1a231f;--tx:#e8f0ec;--mu:#95a59d;--bd:#2a3731;--rd:#e5675a}}
:root[data-theme="dark"]{--g:#8fa8f0;--g2:#22254a;--bg:#111815;--card:#1a231f;--tx:#e8f0ec;--mu:#95a59d;--bd:#2a3731;--rd:#e5675a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:70px}
header{background:#3a2f8f;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
header svg{width:30px;height:30px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600}
button.s{background:var(--g2);color:var(--g)} button.d{background:transparent;color:var(--rd);padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.p{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;text-align:start}
.p b{display:block}.p small{color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st div{background:var(--g2);border-radius:12px;padding:12px}.st span{display:block;color:var(--mu);font-size:13px}.st b{font-size:20px;color:var(--g)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;white-space:nowrap;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:12px}
nav button.on{color:var(--g);border-top:3px solid var(--g)}
.low{color:var(--rd);font-size:12px}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:2px 10px}
.tot{font-size:18px;font-weight:700;display:flex;justify-content:space-between;margin:8px 0}
.empty{color:var(--mu);text-align:center;padding:16px}
.h{overflow-x:auto}
.inv{background:#fff;color:#111;border:1px solid var(--bd);border-radius:14px;padding:16px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}.inv th,.inv td{padding:6px;border-bottom:1px solid #ddd;text-align:start;font-size:14px}
.inv h2{margin:0;color:#3a2f8f}.inv .r{display:flex;justify-content:space-between;padding:3px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts a,.acts button{flex:1;min-width:110px;text-align:center;text-decoration:none;border-radius:10px;padding:10px;font-weight:600}
.acts a{background:#25d366;color:#fff}
@media print{header,nav,.acts{display:none!important}body{background:#fff;padding:0}.inv{border:0}}

:root{--bg:#f3f4fb;--sh:0 2px 10px rgba(40,30,120,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--bd:#262b45;--sh:none}}
body{font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#2c2273,#4f5fd0)!important;padding:12px 16px!important;border-radius:0 0 22px 22px;box-shadow:0 4px 16px rgba(44,34,115,.25);position:sticky;top:0;z-index:5}
header small{display:block;font-weight:400;font-size:12px;opacity:.85;line-height:1.2}
header div{line-height:1.25}
.card{box-shadow:var(--sh);border-radius:16px;padding:14px;border:1px solid var(--bd)}
.card>b:first-child{display:block;margin-bottom:8px;font-size:16px}
button{background:linear-gradient(135deg,#3a2f8f,#4f5fd0);border-radius:12px;padding:11px 16px}
button.s{background:var(--g2);color:var(--g)}
input,select{border-radius:12px;padding:11px}
.p{display:flex;gap:10px;align-items:center;box-shadow:var(--sh);background:var(--card);transition:.15s}
.p:active{transform:scale(.97)}
.av{flex:none;width:38px;height:38px;border-radius:12px;background:var(--g2);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:18px}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
nav{box-shadow:0 -4px 18px rgba(40,30,120,.12);border-radius:20px 20px 0 0;border:0}
nav button{background:none!important;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:9px 2px;border-top:0!important;color:var(--mu)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--g);font-weight:700}
nav button.on svg{background:var(--g2);border-radius:10px;padding:3px;width:32px;height:26px}
.hero{background:linear-gradient(135deg,#2c2273,#4f7fe0);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(58,47,143,.3)}
.hero h3{margin:2px 0 12px;font-size:20px}.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hs div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px}.hs span{display:block;font-size:12px;opacity:.85}.hs b{font-size:15px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);color:var(--g);box-shadow:var(--sh);border:1px solid var(--bd);font-size:13px}
.qa svg{width:26px;height:26px}
.badge{background:#fdecea;color:#c0392b;border-radius:8px;padding:2px 8px;font-size:12px}
nav button{font-size:10px!important;padding:8px 0!important}nav button svg{width:20px;height:20px}nav button.on svg{width:28px!important;height:24px!important}
.st div{border-radius:14px}.row{padding:10px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;background:var(--g2);color:var(--g);padding:9px 4px}.tabs button.on{background:linear-gradient(135deg,#3a2f8f,#4f5fd0);color:#fff}
.ri{display:inline-flex}.ri svg{width:22px;height:22px}.sb{display:flex;align-items:center;justify-content:center;gap:8px}
.badge{display:inline-block}.st div{min-width:0}
</style>
</head>
